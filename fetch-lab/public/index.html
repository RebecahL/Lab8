<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetch Lab</title>
    <!-- IMPORT BOOTSTRAP HERE! -->
</head>

<body class="bg-light">
    <main class="container py-4">
        <h1 class="mb-4">Fetch Lab</h1>

        <section id="hello-section" class="card mb-4">
            <div class="card-body">
                <h2 class="h4">1. Hello (text response)</h2>
                <button id="hello-btn" class="btn btn-primary">
                    Fetch /hello
                </button>
                <div id="hello-result" class="alert alert-secondary mt-3 mb-0" role="alert">
                    Click the button...
                </div>

                <button id="time-btn" class="btn btn-primary">
                    Fetch /api/time
                </button>
                <div id="time-result" class="alert alert-secondary mt-3 mb-0" role="alert"></div>

                <input type="text" id="name-input" name="name-input">
                <button id="greet-btn" class="btn btn-primary">
                    Fetch /api/greet
                </button>
                <div id="greet-result" class="alert alert-secondary mt-3 mb-0" role="alert"></div>

                <button id="slow-btn" class="btn btn-primary">
                    Fetch /api/slow
                </button>
                <div id="slow-result" class="alert alert-secondary mt-3 mb-0" role="alert"></div>

                <form id="message-form" class="mt-4">
                    <label for="msg-author">Author:</label>
                    <input type="text" id="msg-author" name="msg-author">
                    <label for="msg-text">Text:</label>
                    <input type="text" id="msg-text" name="msg-text">
                    <button id="submit-btn" class="btn btn-primary">
                        Submit
                    </button>
                    <button id="webhook-btn" class="btn btn-primary">Send to Webhook</button>
                </form>
                <div id="submit-result" class="alert alert-secondary mt-3 mb-0" role="alert"></div>

            </div>
        </section>

        <!-- You will add more sections below -->

        <script>
            // Your fetch code goes here
            // Put this near the top of your <script> tag
            function statusCheck(response) {
                if (response.ok) return response;
                return response.json()
                    .then(errData => {
                        const msg = errData.error
                            || ('HTTP ' + response.status);
                        throw new Error(msg);
                    })
                    .catch(() => {
                        throw new Error('HTTP ' + response.status);
                    });
            }

            document.getElementById('hello-btn')
                .addEventListener('click', () => {
                    fetch('/hello')
                        .then(statusCheck)
                        .then(res => res.text())
                        .then(text => {
                            document.getElementById('hello-result')
                                .textContent = text;
                        })
                        .catch(error => {
                            document.getElementById('hello-result')
                                .textContent = 'Error: '
                                + error.message;
                        });
                });

            //api/time
            document.getElementById('time-btn')
                .addEventListener('click', () => {
                    fetch('/api/time')
                        .then(statusCheck)
                        .then(res => res.json())
                        .then(text => {
                            console.log(text);
                            document.getElementById('time-result')
                                .textContent = "Current Time: " + text.currentTime + " Message: " + text.message;
                        })
                        .catch(error => {
                            document.getElementById('time-result')
                                .textContent = 'Error: '
                                + error.message;
                        });
                });

            //api/greet
            document.getElementById('greet-btn')
                .addEventListener('click', () => {
                    const name = document.getElementById('name-input').value;
                    fetch('/api/greet/' + name)
                        .then(statusCheck)
                        .then(res => res.json())
                        .then(data => {
                            document.getElementById('greet-result')
                                .textContent = data.greeting;
                        })
                        .catch(error => {
                            document.getElementById('greet-result')
                                .textContent = 'Error: '
                                + error.message;
                        });
                });

            //api/slow
            document.getElementById('slow-btn')
                .addEventListener('click', () => {
                    const resultDiv =
                        document.getElementById('slow-result');
                    resultDiv.textContent =
                        'Loading... please wait';
                    resultDiv.className =
                        'alert alert-secondary mt-3';

                    fetch('/api/slow')
                        .then(statusCheck)
                        .then(res => res.json())
                        .then(data => {
                            resultDiv.textContent = data.message;
                            resultDiv.className =
                                'alert alert-success mt-3';
                        })
                        .catch(error => {
                            resultDiv.textContent =
                                'Error: ' + error.message;
                            resultDiv.className =
                                'alert alert-danger mt-3';
                        });
                });

            //async/await version of api/time
            document.getElementById('time-btn')
                .addEventListener('click', async () => {
                    try {
                        const response =
                            await fetch('/api/time');
                        await statusCheck(response);
                        const data =
                            await response.json();
                        document.getElementById(
                            'time-result').textContent =
                            data.message + ': '
                            + data.currentTime;
                    } catch (error) {
                        document.getElementById(
                            'time-result').textContent =
                            'Error: ' + error.message;
                    }
                });

            //api/messages

            async function postMessage() {
                const text = document.getElementById(
                    'msg-text').value;
                const author = document.getElementById(
                    'msg-author').value;
                try {
                    const response = await fetch(
                        '/api/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/json'
                        },
                        body: JSON.stringify(
                            { text, author })
                    });
                    if (!response.ok) {
                        const errData =
                            await response.json();
                        throw new Error(errData.error);
                    }
                    const newMsg =
                        await response.json();
                    // Display the newly created message

                    if(newMsg.text || newMsg.author) {
                        document.getElementById(
                        'submit-result').textContent = "Text: " + 
                        newMsg.text + ' Author:  '
                        + newMsg.author;
                    }

                } catch (error) {
                   document.getElementById(
                            'submit-result').textContent =
                            'Error: ' + error.message;
                }
            }

            document.getElementById("message-form").addEventListener("submit", function(e){
                e.preventDefault();
                postMessage();
            });

            //part D change url in fetch()

            const webhookURL = "https://api.hooklistener.com/anon/949e64c1-83d4-4442-b7c9-d25874b72577";

            async function Webhook() {
                const text = document.getElementById(
                    'msg-text').value;
                const author = document.getElementById(
                    'msg-author').value;
                try {
                    const response = await fetch(
                        webhookURL, {
                        method: 'POST',
                        headers: {
                            'Content-Type':
                                'application/json'
                        },
                        body: JSON.stringify(
                            { text, author })
                    });
                    if (!response.ok) {
                        const errData =
                            await response.json();
                        throw new Error(errData.error);
                    }
                    const newMsg =
                        await response.json();
                    // Display the newly created message

                    document.getElementById(
                        'webhook-btn').textContent = "Text: " + 
                        newMsg.text + ' Author:  '
                        + newMsg.author;
                } catch (error) {
                   document.getElementById(
                            'webhook-btn').textContent =
                            'Error: ' + error.message;
                }
            }

document.getElementById("webhook-btn")
    .addEventListener("click", Webhook);

        </script>
    </main>
</body>

</html>
